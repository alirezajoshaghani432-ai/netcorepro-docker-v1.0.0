# =============================================================================
#  NetCore Pro — Nginx reverse proxy
#  Author: A.K
# -----------------------------------------------------------------------------
#  Active only when the compose `proxy` profile is enabled:
#      docker compose --profile proxy up -d
#
#  To enable HTTPS:
#    1. Put fullchain.pem and privkey.pem in ./docker/certs/
#    2. Uncomment the `server` block at the bottom of this file
#    3. Uncomment the HTTP→HTTPS redirect inside the port-80 block
#    4. docker compose restart proxy
# =============================================================================

upstream netcorepro_app {
    server app:3000;
    keepalive 32;
}

# Cap abusive clients on the authentication endpoints. The application enforces
# its own limit as well; this is a cheap first line of defence at the edge.
limit_req_zone $binary_remote_addr zone=ncp_auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # --- Uncomment together with the TLS block to force HTTPS ---------------
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # location / { return 301 https://$host$request_uri; }

    # Admin image uploads travel as base64 JSON; keep this above the app limit.
    client_max_body_size 12m;
    client_body_timeout  60s;

    # --- Compression ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/wasm;

    # --- Security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Enable once the certificate is installed and verified:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Long-lived static assets -------------------------------------------
    # Fonts, icon sets, bundled CSS/JS and generated WebP variants are all
    # content-hashed or version-pinned, so a one-year cache is safe.
    location /static/ {
        proxy_pass         http://netcorepro_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Accept            $http_accept;  # keep WebP negotiation intact
        proxy_cache_bypass $http_upgrade;
        expires            1y;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # --- Rate-limited authentication surface --------------------------------
    location /api/auth/ {
        limit_req zone=ncp_auth burst=20 nodelay;
        proxy_pass         http://netcorepro_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Everything else -----------------------------------------------------
    location / {
        proxy_pass         http://netcorepro_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Health probe for external monitoring; never logged.
    location = /api/health {
        proxy_pass  http://netcorepro_app;
        access_log  off;
    }
}

