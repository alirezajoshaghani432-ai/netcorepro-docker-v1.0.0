# ===================================================================
#  NetCore Pro — docker-compose.yml  (SQL Server edition)
# -------------------------------------------------------------------
#  سرویس‌ها:
#    db   → Microsoft SQL Server 2022 (دیتابیس اصلی)
#    app  → اپلیکیشن Node.js (SSR کامل با Hono)
#
#  استفاده:
#    docker compose up -d --build      # ساخت + اجرا
#    docker compose logs -f app        # مشاهده لاگ اپ
#    docker compose down               # خاموش کردن (داده‌ها حفظ می‌شود)
#    docker compose down -v            # خاموش + حذف volumeها (داده‌ها پاک می‌شود!)
#
#  مهاجرت داده از SQLite قدیمی (فقط یک‌بار، اگر فایل data/netcorepro.db دارید):
#    docker compose exec app node scripts/migrate-sqlite-to-mssql.mjs
#
#  مهاجرت از MySQL/MariaDB قبلی:
#    docker compose exec app node scripts/migrate-mysql-to-mssql.mjs
#
#  نکته مهم درباره کد:
#    پوشه dist/ کد «سورس» واقعی و قابل‌ویرایش پروژه است (جاوااسکریپت خوانا
#    و غیرمینیفای‌شده). هیچ مرحله build برای کد سرور وجود ندارد؛ تنها
#    Tailwind CSS اسکریپت build دارد (npm run build:tailwind).
# ===================================================================


services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: netcorepro-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-NetCorePro!Strong1}"
      MSSQL_PID: "Developer"
    volumes:
      - dbdata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    # فقط برای دسترسی از بیرون کانتینر (اختیاری):
    # ports:
    #   - "127.0.0.1:1433:1433"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcorepro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:3000"
      # پشت Nginx:  - "127.0.0.1:8090:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_TO_A_RANDOM_HEX_STRING_AT_LEAST_64_CHARS}"
      MAX_BODY_SIZE_MB: "10"
      CORS_ORIGINS: "*"
      DB_TYPE: mssql
      MSSQL_SERVER: db
      MSSQL_HOST: db
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MSSQL_PASSWORD: "${MSSQL_SA_PASSWORD:-NetCorePro!Strong1}"
      MSSQL_DATABASE: "${MSSQL_DATABASE:-netcorepro}"
      MSSQL_ENCRYPT: "false"
      MSSQL_TRUST_CERT: "true"
    volumes:
      # فایل SQLite/MySQL dump قدیمی برای مهاجرت یک‌باره (فقط-خواندنی) + آپلودها
      - ./data:/app/data:ro
      - ./uploads:/app/uploads
      - ./public/static/uploads:/app/public/static/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  dbdata:
