# ===================================================================
#  NetCore Pro — docker-compose.yml  (نسخه ۳ — رفع unhealthy بودن db)
# -------------------------------------------------------------------
#  سرویس‌ها:
#    db   → MariaDB 10.11 (دیتابیس اصلی، جایگزین SQLite)
#    app  → اپلیکیشن Node.js (SSR کامل با Hono)
#
#  استفاده:
#    docker compose up -d --build      # ساخت + اجرا
#    docker compose logs -f app        # مشاهده لاگ اپ
#    docker compose down               # خاموش کردن (داده‌ها حفظ می‌شود)
#    docker compose down -v            # خاموش + حذف volumeها (داده‌ها پاک می‌شود!)
#
#  هرگز down -v نزنید مگر اینکه عمداً بخواهید دیتابیس را صفر کنید.
#  volume با نام پروژهٔ پوشه ساخته می‌شود (مثلاً netcorepro-docker-v100_dbdata).
#  فیلد name: به این فایل اضافه نشده تا volume موجود عوض نشود.
#
#  مهاجرت داده از SQLite قدیمی (فقط یک‌بار، اگر فایل data/netcorepro.db دارید):
#    docker compose exec app node scripts/migrate-sqlite-to-mysql.mjs
#
#  نکته مهم درباره کد:
#    پوشه dist/ کد «سورس» واقعی و قابل‌ویرایش پروژه است (جاوااسکریپت خوانا
#    و غیرمینیفای‌شده). هیچ مرحله build برای کد سرور وجود ندارد؛ تنها
#    Tailwind CSS اسکریپت build دارد (npm run build:tailwind).
#
#  علت خطای «container netcorepro-db is unhealthy»:
#    healthcheck.sh --connect بدون --su-mysql روی TCP به‌صورت کاربر ناشناس
#    وصل می‌شود و روی ایمیج رسمی MariaDB 10.11 معمولاً fail می‌ماند؛
#    depends_on: service_healthy هم اپ را هرگز استارت نمی‌کند.
# ===================================================================

services:
  db:
    image: mariadb:10.11
    container_name: netcorepro-db
    restart: unless-stopped
    environment:
      # ایمیج 10.11 هر دو پیشوند MYSQL_* و MARIADB_* را می‌خواند؛ هر دو را می‌گذاریم
      # تا init روی تگ‌های مختلف پایدار بماند. روی volume از قبل ساخته‌شده
      # این متغیرها پسورد را عوض نمی‌کنند (فقط first-boot).
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-netcorepro}"
      MYSQL_USER: "${MYSQL_USER:-netcore}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me-app}"
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me-root}"
      MARIADB_DATABASE: "${MYSQL_DATABASE:-netcorepro}"
      MARIADB_USER: "${MYSQL_USER:-netcore}"
      MARIADB_PASSWORD: "${MYSQL_PASSWORD:-change-me-app}"
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      # ایمپورت خودکار دیتابیس (فقط در اولین اجرا، روی volume خالی)
      - ./database/netcorepro.sql:/docker-entrypoint-initdb.d/01-netcorepro.sql:ro
    healthcheck:
      # --su-mysql = سوکت یونیکس با کاربر سیستم mysql (نه TCP ناشناس)
      # --innodb_initialized = دیتادیر آماده است
      # start_period بلند: init اول InnoDB روی دیسک کند بیشتر از ۳۰ ثانیه طول می‌کشد
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    # فقط برای دسترسی از بیرون کانتینر (اختیاری):
    # ports:
    #   - "127.0.0.1:3306:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netcorepro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:3000"
      # پشت Nginx:  - "127.0.0.1:8090:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # کلید JWT را حتماً عوض کنید:  openssl rand -hex 64
      JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_TO_A_RANDOM_HEX_STRING_AT_LEAST_64_CHARS}"
      MAX_BODY_SIZE_MB: "10"
      CORS_ORIGINS: "*"
      # ---- database (MySQL/MariaDB) ----
      DB_TYPE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER:-netcore}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-change-me-app}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-netcorepro}"
      MYSQL_WAIT_SECONDS: "180"
    volumes:
      # فایل SQLite قدیمی برای مهاجرت یک‌باره (فقط-خواندنی) + آپلودها
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  dbdata:
