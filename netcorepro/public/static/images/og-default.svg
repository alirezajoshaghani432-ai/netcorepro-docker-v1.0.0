<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#131826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative network glow -->
  <g opacity="0.18">
    <circle cx="200" cy="120" r="180" fill="url(#accent)"/>
    <circle cx="1050" cy="540" r="220" fill="url(#accent)"/>
  </g>
  <!-- Logo -->
  <g transform="translate(900, 80)">
    <rect width="140" height="140" rx="30" fill="url(#accent)"/>
    <g fill="#fff">
      <circle cx="35"  cy="35"  r="10"/>
      <circle cx="105" cy="35"  r="10"/>
      <circle cx="70"  cy="70"  r="13"/>
      <circle cx="35"  cy="105" r="10"/>
      <circle cx="105" cy="105" r="10"/>
    </g>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
      <line x1="35"  y1="35"  x2="70" y2="70"/>
      <line x1="105" y1="35"  x2="70" y2="70"/>
      <line x1="35"  y1="105" x2="70" y2="70"/>
      <line x1="105" y1="105" x2="70" y2="70"/>
    </g>
  </g>
  <!-- Title -->
  <text x="80" y="280" font-family="Tahoma, Arial, sans-serif" font-size="86" font-weight="bold" fill="#ffffff" direction="rtl">NetCore Pro</text>
  <text x="80" y="360" font-family="Tahoma, Arial, sans-serif" font-size="42" fill="#cbd5e1" direction="rtl">فروشگاه تخصصی تجهیزات شبکه</text>
  <!-- Tagline -->
  <text x="80" y="430" font-family="Tahoma, Arial, sans-serif" font-size="28" fill="#94a3b8" direction="rtl">سوییچ • روتر • فایروال • اکسس‌پوینت</text>
  <!-- Accent bar -->
  <rect x="80" y="480" width="320" height="6" rx="3" fill="url(#accent)"/>
</svg>
